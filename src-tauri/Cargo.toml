[package]
name = "snail-ssh"
version = "1.0.0"
description = "现代化跨平台 SSH & SFTP 终端客户端"
authors = ["SnailSSH Team"]
license = "MIT"
edition = "2021"

[lib]
name = "snail_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
# 单实例锁：双开会让两个进程同时写 ~/.snail-ssh/hosts.json 与 settings.json 互相覆盖，
# 该插件用命名互斥量拦住第二个进程，并把二次启动转成唤回已有窗口
tauri-plugin-single-instance = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# SSH 传输层：libssh2 在 Windows 上只支持 RSA 主机密钥且不支持 OpenSSH 证书，
# 换用纯 Rust 的 russh（支持 ed25519 与证书主机密钥）
russh = { version = "0.64", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "3.0"
tokio = { version = "1.38", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
parking_lot = "0.12"
dirs = "5.0"
# 系统钥匙串：Windows 凭据管理器 / macOS Keychain / Linux Secret Service
keyring = { version = "4", default-features = false, features = ["v1"] }
# 主机密钥指纹（SHA256 base64），用于 known_hosts 校验展示
sha2 = "0.10"
# OpenSSH HashKnownHosts 的 |1|salt|mac 固定是 HMAC-SHA1，不能换成 SHA256
hmac = "0.13"
sha1 = "0.11"
base64 = "0.22"
rand = "0.10"
portable-pty = "0.8"

[target.'cfg(windows)'.dependencies]
# 只在 Windows 上把 ConPTY 子进程放进 Job Object，关闭时连子进程一起结束
winapi = { version = "0.3", features = ["handleapi", "jobapi2", "minwindef", "processthreadsapi", "tlhelp32", "winbase", "winnt"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
