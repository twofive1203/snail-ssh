[package]
name = "snail-ssh"
version = "1.0.0"
description = "现代化跨平台 SSH & SFTP 终端客户端"
authors = ["SnailSSH Team"]
edition = "2021"

[lib]
name = "snail_ssh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ssh2 = "0.9"
tokio = { version = "1.38", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
parking_lot = "0.12"
dirs = "5.0"
# 系统钥匙串：Windows 凭据管理器 / macOS Keychain / Linux Secret Service
keyring = { version = "4", default-features = false, features = ["v1"] }
# 主机密钥指纹（SHA256 base64），用于 known_hosts 校验展示
sha2 = "0.10"
base64 = "0.22"
